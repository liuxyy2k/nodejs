name: Build NodeJS

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "esbuild.js"
      - "esbuild-config.js"
      - "esbuild-website.js"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-dist
          path: dist/
          retention-days: 30
