<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>直播源配置</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd6;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-sub: #666;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            padding: 12px;
            color: var(--text-main);
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: 700;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            appearance: none;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        input.error {
            border-color: var(--danger);
        }

        .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .btn-success:hover {
            background: #26af61;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-danger:hover {
            background: #e84118;
        }

        .source-list {
            margin-top: 25px;
        }

        .list-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .source-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #eee;
            transition: all 0.2s;
        }

        .source-item:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .source-info {
            flex: 1;
            min-width: 0;
        }

        .source-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .source-name {
            font-weight: 600;
            font-size: 15px;
            margin-right: 10px;
        }

        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--success);
            color: white;
            font-size: 11px;
            border-radius: 10px;
            font-weight: 500;
        }

        .source-badge.disabled {
            background: #ccc;
        }

        .source-url {
            font-size: 12px;
            color: var(--text-sub);
            word-break: break-all;
            line-height: 1.4;
        }

        .source-actions {
            display: flex;
            gap: 8px;
            margin-left: 15px;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-icon:hover {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .help-text {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
            line-height: 1.6;
        }

        .help-text strong {
            display: block;
            margin-bottom: 8px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text-sub);
        }

        .loading.active {
            display: block;
        }

        /* Toast 提示样式 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10000;
            max-width: 80%;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .toast.success {
            background: rgba(46, 213, 115, 0.95);
        }

        .toast.error {
            background: rgba(255, 71, 87, 0.95);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/website/" class="back-link">← 返回配置管理</a>

        <h1>📺 直播源配置</h1>

        <!-- 添加新源表单 -->
        <div class="form-section">
            <div class="form-title">添加直播源</div>

            <div class="form-group">
                <label for="sourceName">直播源名称</label>
                <input type="text" id="sourceName" placeholder="例如：央视频道、湖南卫视等" />
                <div class="error-msg" id="sourceNameError"></div>
            </div>

            <div class="form-group">
                <label for="sourceUrl">TXT 链接地址</label>
                <input type="text" id="sourceUrl" placeholder="例如：http://example.com/live.txt" />
                <div class="error-msg" id="sourceUrlError"></div>
            </div>

            <button class="btn btn-primary" id="addSourceBtn">添加直播源</button>
        </div>

        <!-- 直播源列表 -->
        <div class="source-list">
            <div class="list-title">已配置的直播源</div>
            <div id="loading" class="loading">加载中...</div>
            <div id="sourceList"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📭</div>
                <div>暂无直播源配置</div>
            </div>
        </div>

        <!-- 保存按钮 -->
        <button class="btn btn-success" id="saveBtn">💾 保存所有配置</button>

        <!-- 帮助文本 -->
        <div class="help-text">
            <strong>📝 TXT 格式说明：</strong>
            支持格式：频道名,http://链接<br>
            示例：驚艷台,http://15.204.105.50:25461/live/xxx.ts<br>
            纯链接会自动命名为"频道N"，# 开头的行会被视为注释
        </div>
    </div>

    <!-- Toast 提示容器 -->
    <div id="toast" class="toast"></div>

    <script>
        let sources = [];

        // Toast 提示函数
        function showToast(message, type = 'info', duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;

            setTimeout(() => {
                toast.className = 'toast';
            }, duration);
        }

        // 显示错误信息
        function showError(inputId, message) {
            const input = document.getElementById(inputId);
            const errorDiv = document.getElementById(inputId + 'Error');
            input.classList.add('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // 清除错误信息
        function clearError(inputId) {
            const input = document.getElementById(inputId);
            const errorDiv = document.getElementById(inputId + 'Error');
            input.classList.remove('error');
            errorDiv.classList.remove('show');
        }

        // 加载配置
        async function loadConfig() {
            const loading = document.getElementById('loading');
            const sourceList = document.getElementById('sourceList');
            const emptyState = document.getElementById('emptyState');

            loading.classList.add('active');

            try {
                const res = await fetch('/website/live', {
                    headers: { 'Accept': 'application/json' }
                });
                const json = await res.json();

                if (json.code === 0) {
                    sources = json.data.sources || [];
                } else {
                    sources = [];
                }

                renderList();
            } catch (error) {
                console.error('加载配置失败:', error);
                showToast('加载配置失败，请刷新页面重试', 'error', 3000);
                sources = [];
                renderList();
            } finally {
                loading.classList.remove('active');
            }
        }

        // 渲染列表
        function renderList() {
            const list = document.getElementById('sourceList');
            const emptyState = document.getElementById('emptyState');

            if (sources.length === 0) {
                list.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            list.innerHTML = sources.map((s, i) => `
                <div class="source-item">
                    <div class="source-info">
                        <div class="source-header">
                            <span class="source-name">${escapeHtml(s.name)}</span>
                            <span class="source-badge ${s.enabled === false ? 'disabled' : ''}">
                                ${s.enabled === false ? '已禁用' : '已启用'}
                            </span>
                        </div>
                        <div class="source-url">${escapeHtml(s.url)}</div>
                    </div>
                    <div class="source-actions">
                        <button class="btn-icon" data-action="toggle" data-index="${i}" title="切换启用状态">
                            ${s.enabled === false ? '🔓' : '🔒'}
                        </button>
                        <button class="btn btn-danger" data-action="delete" data-index="${i}">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 添加源
        function addSource() {
            const nameInput = document.getElementById('sourceName');
            const urlInput = document.getElementById('sourceUrl');
            const name = nameInput.value.trim();
            const url = urlInput.value.trim();

            // 清除之前的错误提示
            clearError('sourceName');
            clearError('sourceUrl');

            if (!name) {
                showError('sourceName', '请输入直播源名称');
                nameInput.focus();
                return;
            }

            if (!url) {
                showError('sourceUrl', '请输入 TXT 链接地址');
                urlInput.focus();
                return;
            }

            // 验证 URL 格式
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showError('sourceUrl', '请输入有效的链接地址（必须以 http:// 或 https:// 开头）');
                urlInput.focus();
                return;
            }

            // 检查重复
            if (sources.some(s => s.url === url)) {
                showError('sourceUrl', '该直播源链接已存在');
                urlInput.focus();
                return;
            }

            sources.push({
                id: Date.now(),
                name,
                url,
                enabled: true
            });

            renderList();
            showToast('添加成功', 'success');

            nameInput.value = '';
            urlInput.value = '';
            nameInput.focus();
        }

        // 删除源
        function deleteSource(index) {
            const source = sources[index];
            sources.splice(index, 1);
            renderList();
            showToast(`已删除：${source.name}`, 'success');
        }

        // 切换启用状态
        function toggleSource(index) {
            if (sources[index].enabled === false) {
                sources[index].enabled = true;
                showToast('已启用', 'success');
            } else {
                sources[index].enabled = false;
                showToast('已禁用', 'info');
            }
            renderList();
        }

        // 保存
        async function saveAll() {
            try {
                const res = await fetch('/website/live', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sources })
                });

                const json = await res.json();

                if (json.code === 0) {
                    showToast('保存成功！重启服务器后生效', 'success', 3000);
                } else {
                    showToast('保存失败：' + json.message, 'error', 3000);
                }
            } catch (error) {
                console.error('保存失败:', error);
                showToast('保存失败，请检查网络连接', 'error', 3000);
            }
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 绑定事件监听器
        function bindEvents() {
            // 添加直播源按钮
            document.getElementById('addSourceBtn').addEventListener('click', addSource);

            // 保存按钮
            document.getElementById('saveBtn').addEventListener('click', saveAll);

            // 列表中的按钮（使用事件委托）
            document.getElementById('sourceList').addEventListener('click', function(e) {
                const button = e.target.closest('button');
                if (!button) return;

                const action = button.dataset.action;
                const index = parseInt(button.dataset.index);

                if (action === 'delete') {
                    deleteSource(index);
                } else if (action === 'toggle') {
                    toggleSource(index);
                }
            });

            // 输入框获取焦点时清除错误提示
            document.getElementById('sourceName').addEventListener('focus', function() {
                clearError('sourceName');
            });

            document.getElementById('sourceUrl').addEventListener('focus', function() {
                clearError('sourceUrl');
            });

            // 支持 Enter 键提交
            document.getElementById('sourceUrl').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addSource();
                }
            });
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            bindEvents();
            loadConfig();
        });
    </script>
</body>

</html>
