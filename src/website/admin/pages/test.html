        /** 渲染调试结果 */
        function renderDebugResult(data, label) {
            const resultDiv = document.getElementById('debugResult');
            if (!resultDiv) return;

            const recordings = data.recordings || [];
            const response = data.response || {};
            const status = data.responseStatus || 200;

            // 保存到 lastRawData，供 category/detail 调试读取缓存
            lastRawData = data.response || data;
            lastDebugData = data;

            // 统计信息
            const totalDuration = recordings.reduce((sum, r) => sum + (r.duration || 0), 0);
            const successCount = recordings.filter(r => r.status >= 200 && r.status < 400).length;
            const failCount = recordings.filter(r => !(r.status >= 200 && r.status < 400)).length;
            const hasData = response.list !== undefined || response.class !== undefined;

            let html = `
                <div class="debug-summary">
                    <span class="debug-summary-item"><strong>接口:</strong> ${label}</span>
                    <span class="debug-summary-item"><strong>HTTP 状态:</strong>
                        <span class="${status === 200 ? 'status-badge success' : 'status-badge error'}">${status}</span>
                    </span>
                    <span class="debug-summary-item"><strong>内部请求:</strong> ${recordings.length} 次</span>
                    <span class="debug-summary-item"><strong>成功/失败:</strong>
                        <span class="status-badge success">${successCount} 成功</span>
                        ${failCount > 0 ? `<span class="status-badge error">${failCount} 失败</span>` : ''}
                    </span>
                    <span class="debug-summary-item"><strong>总耗时:</strong>
                        <span style="color:#e0e0e0;">${totalDuration > 0 ? formatDuration(totalDuration) : '—'}</span>
                    </span>
                    <span class="debug-summary-item"><strong>数据:</strong>
                        ${hasData
                            ? '<span class="status-badge success">有数据</span>'
                            : '<span class="status-badge error">无数据/异常</span>'
                        }
                    </span>
                    <button class="save-btn" onclick="saveDebugResponse('${label}')" style="margin-left:auto;" title="保存此次返回数据到本地">💾 保存</button>
                </div>
            `;

            // 录制信息
            if (recordings.length > 0) {
                html += '<div style="margin-top:8px;"><div style="color:#e0e0e0;font-size:12px;font-weight:bold;margin-bottom:6px;">📡 内部 HTTP 请求记录</div>';
                recordings.forEach((rec, i) => {
                    const isOk = rec.status >= 200 && rec.status < 400;
                    const statusClass = isOk ? 'status-ok' : 'status-err';
                    const durationColor = !rec.duration ? '' : rec.duration < 1000 ? '#22c55e' : rec.duration < 3000 ? '#eab308' : '#ef4444';
                    const durationStr = rec.duration != null ? formatDuration(rec.duration) : '';
                    html += `
                        <div class="recording-card">
                            <div class="recording-card-header" onclick="toggleRecording(this)">
                                <span>#${i + 1}</span>
                                <span class="status-badge ${isOk ? 'success' : 'error'}">${rec.method || 'GET'}</span>
                                <span class="${statusClass}">${rec.status || '—'}</span>
                                <span class="rec-duration" style="color:${durationColor};">${durationStr}</span>
                                <span style="flex:1;color:#888;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(rec.url)}</span>
                                <span style="color:#888;font-size:10px;">${rec.dataLength != null ? formatSize(rec.dataLength) : ''}</span>
                                <span class="rec-toggle" style="color:#666;font-size:10px;">▼</span>
                            </div>
                            <div class="recording-card-body collapsed">
                                <div class="debug-key-value"><span class="key">URL:</span><span class="value" style="word-break:break-all;">${escapeHtml(rec.url)}</span></div>
                                <div class="debug-key-value"><span class="key">方法:</span><span class="value">${rec.method || 'GET'}</span></div>
                                <div class="debug-key-value"><span class="key">状态码:</span><span class="value ${statusClass}">${rec.status || '—'}</span></div>
                                <div class="debug-key-value"><span class="key">返回大小:</span><span class="value">${rec.dataLength != null ? formatSize(rec.dataLength) + ' (' + rec.dataLength + ' 字节)' : '未知'}</span></div>
                                <div class="debug-key-value"><span class="key">内容类型:</span><span class="value">${rec.contentType || '未知'}</span></div>
                                ${rec.duration != null ? `<div class="debug-key-value"><span class="key">耗时:</span><span class="value" style="color:${durationColor};font-weight:bold;">${formatDuration(rec.duration)}</span></div>` : ''}
                                ${rec.error ? `<div class="debug-key-value"><span class="key" style="color:#ef4444;">错误:</span><span class="value" style="color:#ef4444;">${escapeHtml(rec.error)}</span></div>` : ''}
                                ${renderRecordingDetails(rec)}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += `
                    <div class="recording-card">
                        <div class="recording-card-header" style="cursor:default;">
                            <span style="color:#888;">📡 无内部 HTTP 请求记录</span>
                        </div>
                        <div class="recording-card-body">
                            <div style="color:#888;font-size:11px;">
                                爬虫没有发起任何 HTTP 请求，可能是直接返回了缓存数据或静态结果。
                            </div>
                        </div>
                    </div>
                `;
            }

            // 返回数据
            html += `
                <div class="debug-response-box">
                    <div class="debug-response-header" onclick="toggleResponseData(this)">
                        <span style="color:#e0e0e0;font-size:12px;font-weight:bold;">📦 爬虫返回数据</span>
                        <span class="rec-toggle" style="color:#666;font-size:10px;">▼</span>
                    </div>
                    <pre class="response-data">${escapeHtml(JSON.stringify(response, null, 2))}</pre>
                </div>
            `;

            resultDiv.innerHTML = html;

            // 更新状态
            const itemCount = response.list?.length || response.class?.length || 0;
            const countInfo = itemCount > 0 ? ` (返回 ${itemCount} 项)` : '';
            const timeInfo = totalDuration > 0 ? `，总耗时 ${formatDuration(totalDuration)}` : '';
            updateStep(`🐛 ${label} 调试完成${countInfo}${timeInfo}`,
                recordings.length > 0
                    ? `内部发起 ${recordings.length} 次 HTTP 请求${timeInfo}，详见下方`
                    : '爬虫未发起 HTTP 请求');
        }

        /** 渲染录制的附加详情（请求头 + 响应预览） */
        function renderRecordingDetails(rec) {
            let html = '';
            // 请求头
            if (rec.requestHeaders && Object.keys(rec.requestHeaders).length > 0) {
                html += '<div class="rec-section" style="margin-top:6px;">';
                html += '<div class="rec-section-title" onclick="this.nextElementSibling.classList.toggle(\\'collapsed\\')" style="cursor:pointer;user-select:none;">';
                html += '  📋 请求头 <span style="color:#666;font-size:9px;">▼</span>';
                html += '</div>';
                html += '<div class="rec-section-body collapsed" style="background:#1e1e1e;border-radius:4px;padding:6px;margin-top:4px;font-size:10px;font-family:monospace;color:#888;max-height:300px;overflow-y:auto;">';
                for (const [k, v] of Object.entries(rec.requestHeaders)) {
                    html += `<span style="color:#7c3aed;">${escapeHtml(k)}</span>: <span style="color:#ccc;">${escapeHtml(String(v))}</span>\
`;
                }
                html += '</div></div>';
            }
            // 响应体预览
            if (rec.responsePreview) {
                const isLong = rec.responsePreview.length > 500;
                html += '<div class="rec-section" style="margin-top:4px;">';
                html += `<div class="rec-section-title" onclick="toggleSection(this)" style="cursor:pointer;user-select:none;">`;
                html += '  📄 响应预览 ' + (rec.dataLength != null ? `(${formatSize(rec.dataLength)})` : '') + ' <span style="color:#666;font-size:9px;">▼</span>';
                html += '</div>';
                html += `<div class="rec-section-body ${isLong ? 'collapsed' : ''}" style="background:#1e1e1e;border-radius:4px;padding:6px;margin-top:4px;font-size:10px;font-family:monospace;color:#ccc;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;">`;
                html += escapeHtml(rec.responsePreview);
                html += '</div></div>';
            }
            return html;
        }

        /** 切换录制卡片的折叠状态 */
        function toggleRecording(el) {
            const body = el.nextElementSibling;
            if (body) {
                body.classList.toggle('collapsed');
                const toggle = el.querySelector('.rec-toggle');
                if (toggle) toggle.textContent = body.classList.contains('collapsed') ? '▼' : '▲';
            }
        }

        /** 切换区域折叠 */
        function toggleSection(el) {
            const body = el.nextElementSibling;
            if (body) {
                body.classList.toggle('collapsed');
                const toggle = el.querySelector('.rec-toggle') || el.querySelector('span:last-child');
                if (toggle) toggle.textContent = body.classList.contains('collapsed') ? '▼' : '▲';
            }
        }

        /** 切换返回数据折叠 */
        function toggleResponseData(el) {
            const pre = el.nextElementSibling;
            if (pre) {
                pre.classList.toggle('collapsed');
                const toggle = el.querySelector('.rec-toggle');
                if (toggle) toggle.textContent = pre.classList.contains('collapsed') ? '▼' : '▲';
            }
        }

        /** 格式化耗时 */
        function formatDuration(ms) {
            if (ms == null) return '';
            if (ms < 1000) return ms + 'ms';
            if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
            return Math.floor(ms / 60000) + 'm ' + Math.floor((ms % 60000) / 1000) + 's';
        }

        /** 格式化字节大小 */
        function formatSize(bytes) {
            if (bytes == null) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        /** HTML 转义 */
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /** 保存调试返回数据到本地文件 */
        function saveDebugResponse(label) {
            if (!lastDebugData) {
                showToast('没有可保存的数据', 'error');
                return;
            }
            const response = lastDebugData.response || {};
            const recordings = lastDebugData.recordings || [];
            const spiderName = currentSpider ? currentSpider.name || currentSpider.key : 'unknown';
            const timestamp = formatTimestamp();

            // 构建保存内容：包含爬虫返回数据 + 录制详情
            const saveContent = {
                spider: spiderName,
                endpoint: label,
                timestamp: new Date().toISOString(),
                response: response,
                recordings: recordings.map(r => ({
                    url: r.url,
                    method: r.method,
                    status: r.status,
                    dataLength: r.dataLength,
                    contentType: r.contentType,
                    duration: r.duration,
                    error: r.error,
                    requestHeaders: r.requestHeaders,
                    responsePreview: r.responsePreview,
                })),
            };

            downloadAsJson(saveContent, `${spiderName}_${label}_${timestamp}.json`);
            showToast(`已保存 ${spiderName}_${label}_${timestamp}.json`, 'success');
        }

        /** 通用保存 raw 数据到本地（给原始返回值区域的保存按钮用） */
        function saveRawData() {
            const rawContent = document.getElementById('rawContent');
            const pre = rawContent?.querySelector('pre');
            if (!pre || !pre.textContent || pre.textContent === '暂无数据') {
                showToast('没有可保存的数据', 'error');
                return;
            }
            try {
                // 尝试解析为 JSON 再保存（格式化的）
                const parsed = JSON.parse(pre.textContent);
                const spiderName = currentSpider ? currentSpider.name || currentSpider.key : 'unknown';
                const timestamp = formatTimestamp();
                downloadAsJson(parsed, `${spiderName}_raw_${timestamp}.json`);
                showToast('已保存原始数据', 'success');
            } catch {
                // 非 JSON 内容，保存为纯文本
                const spiderName = currentSpider ? currentSpider.name || currentSpider.key : 'unknown';
                const timestamp = formatTimestamp();
                const blob = new Blob([pre.textContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${spiderName}_raw_${timestamp}.txt`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已保存原始数据', 'success');
            }
        }

        /** 下载 JSON 文件 */
        function downloadAsJson(obj, filename) {
            const json = JSON.stringify(obj, null, 2);
            const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /** 格式化时间戳用于文件名 */
        function formatTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const M = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}${M}${d}_${h}${m}${s}`;
        }

        // ==================== 接口监听 ====================

        let monitorEvents = [];
        let monitorSource = null;
        let monitorFilter = 'all'; // 'all' | 'spider'
        const MAX_MONITOR_EVENTS = 50;

        /** 打开监听面板 */
        function showMonitorPanel() {
            if (!currentSpider) {
                showToast('请先选择爬虫', 'error');
                return;
            }
            resetTestState();

            const key = currentSpider.key;
            const html = `
                <div class="debug-panel">
                    <div class="debug-panel-title">

                        <span class="status-badge info" id="monitorStatus">连接中...</span>
                        <span style="color:#888;font-weight:normal;font-size:11px;margin-left:6px;">
                            实时显示服务器收到的 /spider API 请求与返回
                        </span>
                    </div>
                    <div class="debug-actions">
                        <button class="debug-btn home" id="monFilterAll" onclick="setMonitorFilter('all')">全部请求</button>
                        <button class="debug-btn category" id="monFilterSpider" onclick="setMonitorFilter('spider')">仅 ${escapeHtml(currentSpider.name || key)}</button>
                        <button class="debug-btn detail" onclick="clearMonitorEvents()">清空</button>
                        <button class="save-btn" onclick="saveMonitorLog()" style="margin-left:auto;">💾 导出</button>
                    </div>
                    <div class="debug-hint">
                        💡 监听服务器接收到的所有爬虫接口请求（包括其他设备/客户端的调用），
                        点击条目可展开查看请求体和返回数据
                    </div>
                    <div id="monitorList"></div>
                </div>
            `;
            showContent(html);
            updateStep('🎧 接口监听', '实时显示服务器接收的 API 请求与返回数据');
            updateBreadcrumb(['首页', currentSpider.name || key, '监听']);

            connectMonitor();

        /** 建立 SSE 连接（EventSource 断线自动重连） */
        function connectMonitor() {
            if (monitorSource) return;
            const source = new EventSource(`${API_BASE}/website/monitor/stream`);
            monitorSource = source;

            // 连接建立（含重连成功）时拉取历史记录并合并（按 id 去重）
            source.onopen = async () => {
                updateMonitorStatus('在线');
                try {
                    const resp = await fetch(`${API_BASE}/website/monitor/history?limit=${MAX_MONITOR_EVENTS}`);
                    const list = await resp.json();
                    const ids = new Set(monitorEvents.map(e => e.id));
                    monitorEvents = [...list.filter(e => !ids.has(e.id)), ...monitorEvents];
                    monitorEvents = monitorEvents.slice(-MAX_MONITOR_EVENTS);
                    renderMonitorEvents();
                } catch { /* 忽略 */ }
            };

            source.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    monitorEvents.push(event);
                    monitorEvents = monitorEvents.slice(-MAX_MONITOR_EVENTS);
                    renderMonitorEvents();
                } catch { /* 忽略 */ }
            };

            source.onerror = () => {
                updateMonitorStatus('已断开，重连中...');
            };
        }

        /** 更新连接状态显示 */
        function updateMonitorStatus(text) {
            const el = document.getElementById('monitorStatus');
            if (el) el.textContent = text;
        }

        /** 设置过滤器 */
        function setMonitorFilter(filter) {
            monitorFilter = filter;
            renderMonitorEvents();
        }

        /** 清空监听记录（本地 + 服务端缓冲） */
        async function clearMonitorEvents() {
            monitorEvents = [];
            renderMonitorEvents();
            try { await fetch(`${API_BASE}/website/monitor/clear`); } catch { /* 忽略 */ }
            showToast('已清空监听记录', 'success');
        }

        /** 获取爬虫显示名 */
        function getSpiderName(key) {
            const spider = spiders.find(s => s.key === key);
            return spider ? (spider.name || key) : (key || '未知');
        }

        /** 渲染监听列表（最新的在前） */
        function renderMonitorEvents() {
            const listEl = document.getElementById('monitorList');
            if (!listEl) return;

            const filtered = monitorFilter === 'spider'
                ? monitorEvents.filter(e => e.spider === currentSpider.key)
                : monitorEvents;
            const shown = filtered.slice().reverse();

            // 更新过滤按钮高亮
            const btnAll = document.getElementById('monFilterAll');
            const btnSpider = document.getElementById('monFilterSpider');
            if (btnAll) btnAll.style.filter = monitorFilter === 'all' ? 'brightness(1.5)' : '';
            if (btnSpider) btnSpider.style.filter = monitorFilter === 'spider' ? 'brightness(1.5)' : '';

            if (shown.length === 0) {
                listEl.innerHTML = '<div class="empty-state">暂无监听记录，等待 API 请求...</div>';
                return;
            }

            let html = `<div style="color:#888;font-size:11px;margin-bottom:8px;">共 ${shown.length} 条记录（缓冲上限 ${MAX_MONITOR_EVENTS} 条）</div>`;
            shown.forEach(ev => {
                const isOk = ev.status >= 200 && ev.status < 400;
                const statusClass = isOk ? 'status-ok' : 'status-err';
                const durationColor = ev.duration == null ? '' : ev.duration < 1000 ? '#22c55e' : ev.duration < 3000 ? '#eab308' : '#ef4444';
                const durationStr = ev.duration != null ? formatDuration(ev.duration) : '';
                html += `
                    <div class="recording-card">
                        <div class="recording-card-header" onclick="toggleRecording(this)">
                            <span>#${ev.id}</span>
                            <span class="status-badge ${isOk ? 'success' : 'error'}">${escapeHtml(ev.method || 'POST')}</span>
                            <span class="${statusClass}">${ev.status || '—'}</span>
                            <span class="rec-duration" style="color:${durationColor};">${durationStr}</span>
                            <span style="flex:1;color:#888;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ev.path)}</span>
                            <span style="color:#888;font-size:10px;">${escapeHtml(formatMonitorTime(ev.time))}</span>
                            <span class="rec-toggle" style="color:#666;font-size:10px;">▼</span>
                        </div>
                        <div class="recording-card-body collapsed">
                            <div class="debug-key-value"><span class="key">爬虫:</span><span class="value">${escapeHtml(getSpiderName(ev.spider))} (key: ${escapeHtml(ev.spider || '-')}, type: ${escapeHtml(ev.type || '-')})</span></div>
                            <div class="debug-key-value"><span class="key">接口:</span><span class="value">${escapeHtml(ev.endpoint || '-')}</span></div>
                            <div class="debug-key-value"><span class="key">时间:</span><span class="value">${escapeHtml(new Date(ev.time).toLocaleString('zh-CN', { hour12: false }))}（耗时 ${escapeHtml(durationStr || '-')}）</span></div>
                            <div class="debug-key-value"><span class="key">来源 IP:</span><span class="value">${escapeHtml(ev.ip || '-')}</span></div>
                            <div class="debug-key-value"><span class="key">状态码:</span><span class="value ${statusClass}">${ev.status || '—'}</span></div>
                            ${renderMonitorPayload('📤 请求体', ev.body, true)}
                            ${renderMonitorPayload('📥 返回数据', ev.response, false)}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        /** 渲染请求体/返回数据区块 */
        function renderMonitorPayload(title, text, isBody) {
            if (text == null || text === '') {
                return `
                    <div class="rec-section" style="margin-top:4px;">
                        <div class="rec-section-title" style="cursor:default;">${title} <span style="color:#555;">(无)</span></div>
                    </div>`;
            }
            const pretty = prettyJson(text);
            const isLong = pretty.length > 1000;
            return `
                <div class="rec-section" style="margin-top:4px;">
                    <div class="rec-section-title" onclick="toggleSection(this)" style="cursor:pointer;user-select:none;">
                        ${title} <span style="color:#666;font-size:9px;">▼</span>
                    </div>
                    <div class="rec-section-body ${isLong ? 'collapsed' : ''}" style="background:#1e1e1e;border-radius:4px;padding:6px;margin-top:4px;font-size:10px;font-family:monospace;color:${isBody ? '#7dd3fc' : '#86efac'};max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;">
                        ${escapeHtml(pretty)}
                    </div>
                </div>`;
        }

        /** JSON 美化，解析失败则原样返回 */
        function prettyJson(str) {
            if (str == null) return '';
            try {
                return JSON.stringify(JSON.parse(str), null, 2);
            } catch {
                return String(str);
            }
        }

        /** 格式化事件时间 HH:MM:SS.mmm */
        function formatMonitorTime(iso) {
            const d = new Date(iso);
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            const ms = String(d.getMilliseconds()).padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        /** 导出监听记录 */
        function saveMonitorLog() {
            if (monitorEvents.length === 0) {
                showToast('没有可导出的记录', 'error');
                return;
            }
            downloadAsJson({ exportedAt: new Date().toISOString(), events: monitorEvents }, `monitor_log_${formatTimestamp()}.json`);
            showToast('已导出监听记录', 'success');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadWidths();
            initResizers();
            loadSpiders();
        });
    </script>
</body>

</html>
